<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <title>Lingu3 — learn up to 3 languages</title>
    <meta name="application-name" content="Lingu3" />
    <meta name="apple-mobile-web-app-title" content="Lingu3" />
    <style>
      /* Shown only if the app never mounts. React replaces #root's contents on
         boot, so if you are reading this in a browser, the bundle failed to
         load or threw before first render — which is exactly the case a blank
         page tells you nothing about. */
      #boot-fallback {
        display: none;
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.55;
        color: #1f2933;
      }
      #boot-fallback.visible { display: block; }
      #boot-fallback code {
        background: #f0eee9;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      #boot-fallback button {
        font: inherit;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 1px solid #2f6f5e;
        background: #2f6f5e;
        color: #fff;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      #boot-error {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        background: #f0eee9;
        padding: 0.75rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #15181b; }
        #boot-fallback { color: #e8e6e1; }
        #boot-fallback code, #boot-error { background: #1d2125; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-fallback">
      <h2>Lingua didn't start</h2>
      <p>
        The page loaded but the app failed to run. The most common cause is an
        old service worker still serving a stale or broken copy — tap below to
        clear it and reload.
      </p>
      <button onclick="window.__linguaReset()">Clear cache and reload</button>
      <p>
        If that doesn't help, the error is below. Send it to Claude and it can
        be fixed.
      </p>
      <pre id="boot-error">(no error captured)</pre>
    </div>

    <script>
      // Capture anything that goes wrong before or during boot, so a failure
      // shows a message and an escape hatch rather than a black screen.
      window.__linguaBootError = null;
      function showBootFallback(detail) {
        var el = document.getElementById('boot-fallback');
        if (!el || el.classList.contains('visible')) return;
        el.classList.add('visible');
        if (detail) {
          document.getElementById('boot-error').textContent = String(detail);
        }
      }
      window.addEventListener('error', function (e) {
        window.__linguaBootError = (e && (e.error && e.error.stack || e.message)) || 'script error';
        showBootFallback(window.__linguaBootError);
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__linguaBootError = (e && e.reason && (e.reason.stack || e.reason.message)) || 'promise rejection';
        showBootFallback(window.__linguaBootError);
      });

      // Unregister every service worker and delete every cache, then reload
      // from the network. This is the cure for a shell cached from a login
      // wall or a half-broken deploy.
      window.__linguaReset = async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (err) {
          /* best effort — reload regardless */
        }
        location.replace(location.pathname + '?reset=' + Date.now());
      };

      // If React hasn't mounted after a few seconds, something is wrong.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          showBootFallback(window.__linguaBootError || 'The app bundle did not mount within 8 seconds.');
        }
      }, 8000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
